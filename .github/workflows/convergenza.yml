# COMETA — raccolta della convergenza delle previsioni di Tawhiri
#
# Una volta al giorno chiede a Tawhiri il volo previsto per oggi e per i
# sette giorni seguenti, per ciascuno dei siti di
# calcolo/convergenza_raccolta.py, e aggiunge i punti di atterraggio ai
# CSV sul branch `dati` (convergenza.csv per Mercedes, convergenza_<sito>.csv
# per gli altri). Quel branch
# non e' protetto dal ruleset e non e' quello da cui si pubblica il sito:
# il bot ci scrive senza PR e senza rigenerare le pagine.
#
# Le schedule girano solo dal branch di default, quindi questo file deve
# stare su main. Si puo' lanciare anche a mano (Actions -> Run workflow).

name: Convergenza delle previsioni

on:
  schedule:
    # 03:37 UTC (00:37 in Uruguay). Le schedule di GitHub partono con ore
    # di ritardo (5-8 h nei primi giorni): cosi' il giro cade comunque
    # prima del lancio delle 14:00 UTC. Quale corsa GFS trova non conta,
    # l'analisi misura l'anticipo dal dataset. Non prima delle 03:00 UTC,
    # quando in Uruguay e' ancora il giorno prima; non al minuto 0, dove
    # le schedule si accodano di piu'.
    - cron: "37 3 * * *"
    # Altri tre giri, uno per ciascuna delle altre corse GFS (00, 06, 12,
    # 18 UTC: 21, 03, 09, 15 in Uruguay), solo per La Calera, il sito del
    # lancio: la sua curva si misura a passo di 6 h. Con i ritardi delle
    # schedule due giri possono trovare la stessa corsa: il secondo non
    # aggiunge righe (deduplica su dataset e bersaglio).
    - cron: "37 9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convergenza
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Script (da main)
        uses: actions/checkout@v4

      - name: Dati (branch dati, creato vuoto al primo giro)
        run: |
          if git ls-remote --exit-code --heads origin dati >/dev/null; then
            git fetch --no-tags origin dati
            git worktree add ${{ runner.temp }}/dati FETCH_HEAD
            git -C ${{ runner.temp }}/dati checkout -B dati
          else
            git worktree add --detach ${{ runner.temp }}/dati
            git -C ${{ runner.temp }}/dati checkout --orphan dati
            git -C ${{ runner.temp }}/dati rm -rfq .
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Otto previsioni per sito
        run: |
          if [ "${{ github.event.schedule }}" = "37 9,15,21 * * *" ]; then
            python3 calcolo/convergenza_raccolta.py --dir ${{ runner.temp }}/dati --sito lacalera
          else
            python3 calcolo/convergenza_raccolta.py --dir ${{ runner.temp }}/dati
          fi

      - name: Curva per la pagina La traiettoria
        # la legge assets/traiettoria.js (opzione «Errore di previsione»);
        # se fallisce, i dati raccolti si salvano comunque
        continue-on-error: true
        # La Calera a passo di 6 h appena le classi con almeno 8 campioni
        # coprono tutta la settimana (fino a 144 h di eta' della corsa);
        # fino ad allora Mercedes, a passo di 24 h
        run: |
          D=${{ runner.temp }}/dati
          # ritardo delle corse GFS in Tawhiri, misurato da tutti i giri di tutti i siti
          python3 calcolo/convergenza_analisi.py $D/convergenza_lacalera.csv --passo 6 --min-n 8 --copertura-h 144 \
                  --nome "La Calera, Minas (Uruguay)" --json $D/convergenza_curva.json \
                  --disponibilita $D/convergenza*.csv \
            || python3 calcolo/convergenza_analisi.py $D/convergenza.csv --json $D/convergenza_curva.json \
                  --disponibilita $D/convergenza*.csv

      - name: Commit sul branch dati
        working-directory: ${{ runner.temp }}/dati
        run: |
          # *.csv e' nel .gitignore di main: qui serve -f
          git add -f convergenza*.csv
          if [ -f convergenza_curva.json ]; then git add -f convergenza_curva.json; fi
          if git diff --cached --quiet; then
            echo "Nessuna riga nuova (stesso dataset del giro precedente)."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Convergenza: previsioni del $(date -u +%Y-%m-%d)"
          git push origin dati
