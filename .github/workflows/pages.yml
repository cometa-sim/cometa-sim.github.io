# Pubblicazione del sito su GitHub Pages.
#
# Sostituisce la pubblicazione automatica di GitHub — quella che non
# compare fra i file e che in Actions si chiama "pages build and
# deployment". Questa invece sta qui, si legge e si modifica.
#
# Perche' esiste: il 27 agosto 2026 la pubblicazione automatica si e'
# incastrata in coda senza mai partire, e non c'era modo di annullarla
# ne' dall'interfaccia ne' via API. Un flusso di lavoro scritto nel
# repository usa la coda normale di Actions e non dipende da quella.
#
# Il sito e' HTML statico: non serve Jekyll, si pubblica la cartella
# cosi' com'e'. Il file CNAME viene incluso, quindi il dominio
# personalizzato resta.

name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:          # permette di lanciarla a mano da Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta. cancel-in-progress fa si' che una nuova
# scavalchi quella in attesa invece di accodarsi: e' la protezione
# contro il blocco che ha motivato questo file.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
